aid: office-luv
name: Office Luv
description: >-
  OfficeLuv is office management and purchasing software that centralizes all of a
  workplace's ordering into a single platform. It aggregates dozens of vendors and
  thousands of products (supplies, snacks, cleaning supplies, groceries, and more)
  into one unified marketplace with consolidated invoicing, spend analytics and
  reporting, multi-user approval workflows, employee stipends for remote and in-office
  staff, and optional on-site service for program design, pricing negotiation, and
  restocking. Customers include Wayfair, Braze, Glassdoor, Hulu, and Upwork. Office
  Luv was surfaced as a 500 Global portfolio company and added to the API Evangelist
  network. The product is delivered as a private SaaS web application (app.officeluv.com);
  no public developer API, OpenAPI, or SDK surface is published at this time.
